name: Build Bink2 FFmpeg WASM

on:
  push:
    branches: [chatgpt-bink2-wasm-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EMSDK_VERSION: 6.0.1
      PREFIX: ${{ github.workspace }}/wasm-prefix
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config autoconf automake libtool nasm yasm curl

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Fetch FFmpeg 7.1.2 and Bink2 patch
        run: |
          git clone --depth 1 --branch n7.1.2 https://github.com/FFmpeg/FFmpeg.git ffmpeg
          curl -fL https://raw.githubusercontent.com/sharpemu/ffmpeg-core/master/bink2.patch -o bink2.patch
          cd ffmpeg
          git apply ../bink2.patch
          # SharpEmu currently stores the alpha bitmask itself in has_alpha.  Later
          # code uses has_alpha as a count/boolean, so normalize it to 0/1.
          sed -i 's/c->has_alpha = c->flags & BINK_FLAG_ALPHA;/c->has_alpha = !!(c->flags \& BINK_FLAG_ALPHA);/' libavcodec/bink2.c
          grep -F 'c->has_alpha = !!(c->flags & BINK_FLAG_ALPHA);' libavcodec/bink2.c

      - name: Build libvpx VP9 for WASM
        run: |
          git clone --depth 1 --branch v1.16.0 https://chromium.googlesource.com/webm/libvpx libvpx
          mkdir -p "$PREFIX"
          cd libvpx
          emconfigure ./configure \
            --prefix="$PREFIX" \
            --target=generic-gnu \
            --disable-shared \
            --enable-static \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --disable-vp8 \
            --enable-vp9 \
            --enable-vp9-encoder \
            --disable-vp9-decoder \
            --disable-multithread \
            --disable-runtime-cpu-detect \
            --disable-webm-io \
            --disable-libyuv \
            --extra-cflags=-Oz
          emmake make -j"$(nproc)"
          emmake make install

      - name: Configure patched FFmpeg
        run: |
          cd ffmpeg
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          emconfigure ./configure \
            --target-os=none \
            --arch=x86_32 \
            --enable-cross-compile \
            --disable-x86asm \
            --disable-inline-asm \
            --disable-stripping \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-all \
            --disable-network \
            --disable-iconv \
            --disable-runtime-cpudetect \
            --disable-pthreads \
            --disable-w32threads \
            --disable-os2threads \
            --enable-ffmpeg \
            --disable-ffprobe \
            --disable-ffplay \
            --enable-avcodec \
            --enable-avformat \
            --enable-avfilter \
            --enable-swresample \
            --enable-swscale \
            --enable-decoder=binkvideo2,binkaudio_dct,binkaudio_rdft \
            --enable-demuxer=bink \
            --enable-muxer=webm \
            --enable-encoder=libvpx_vp9,opus \
            --enable-protocol=file \
            --enable-filter=format,aformat,aresample \
            --enable-libvpx \
            --cc=emcc \
            --cxx=em++ \
            --ar=emar \
            --ranlib=emranlib \
            --nm=emnm \
            --pkg-config-flags=--static \
            --optflags=-Oz \
            --extra-cflags="-Oz -I$PREFIX/include" \
            --extra-ldflags="-Oz -L$PREFIX/lib"

      - name: Build browser core
        run: |
          cd ffmpeg
          emmake make -j"$(nproc)" ffmpeg \
            'LDEXEFLAGS=-Oz -sMODULARIZE=1 -sEXPORT_ES6=1 -sALLOW_MEMORY_GROWTH=1 -sINITIAL_MEMORY=268435456 -sMAXIMUM_MEMORY=2147483648 -sEXIT_RUNTIME=1 -sEXPORTED_RUNTIME_METHODS=FS,callMain -sENVIRONMENT=web,worker'
          mkdir -p ../dist
          cp ffmpeg ../dist/ffmpeg.js
          cp ffmpeg_g.wasm ../dist/ffmpeg_g.wasm
          cp COPYING.LGPLv2.1 ../dist/
          file ../dist/*
          du -h ../dist/*

      - name: Upload WASM core
        uses: actions/upload-artifact@v4
        with:
          name: bink2-ffmpeg-wasm-core
          path: dist
          if-no-files-found: error
          retention-days: 14
